<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رزنامة طاقم البخاري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">
<style>
/* Layout: one column; month buttons as a grid, tasks grouped by school week below */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#1b2340; --muted:#5d6480; --line:#dde0ea;
  --board:#1f3a8a; --board-ink:#f1f3fb; --accent:#c9962e; --accent-soft:#f8efdb; --done:#3f8a5c;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","IBM Plex Sans Hebrew",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141f; --surface:#1a1f30; --ink:#e6e9f3; --muted:#9aa1bb; --line:#2c3350;
  --board:#22397a; --board-ink:#f1f3fb; --accent:#e0b04f; --accent-soft:#332a17; --done:#6cc08d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141f; --surface:#1a1f30; --ink:#e6e9f3; --muted:#9aa1bb; --line:#2c3350;
  --board:#22397a; --board-ink:#f1f3fb; --accent:#e0b04f; --accent-soft:#332a17; --done:#6cc08d; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl;padding:0 16px}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
header{background:var(--board);color:var(--board-ink);border-radius:14px;padding:18px;display:flex;align-items:center;gap:18px;border-bottom:4px solid var(--accent)}
.logo{flex:none;background:#fff;border-radius:12px;padding:6px;width:120px}
.logo img{display:block;width:100%;height:auto}
.head-text{display:flex;flex-direction:column;gap:6px;min-width:0}
header h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;text-wrap:balance;line-height:1.35}
header p{margin:0;opacity:.85;font-size:.92rem}
.year{display:inline-block;font-size:.78rem;letter-spacing:.04em;background:rgba(255,255,255,.14);padding:2px 10px;border-radius:999px;align-self:flex-start}
@media (max-width:520px){header{flex-direction:column;text-align:center}.head-text{align-items:center}.year{align-self:center}}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.months button{font:inherit;font-family:var(--display);font-size:.98rem;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .15s,border-color .15s}
.months button small{font-family:var(--body);font-size:.74rem;color:var(--muted)}
.months button:hover{border-color:var(--accent)}
.months button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#2a1e08}
.months button[aria-selected="true"] small{color:#4a3714}
.months button:focus-visible,.task input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.now-dot{width:6px;height:6px;border-radius:50%;background:var(--done)}
@media (max-width:620px){.months{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:420px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}}
.summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.summary h2{font-family:var(--display);font-size:1.4rem;margin:0}
.summary span{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.weeks{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.week{display:flex;flex-direction:column;gap:8px}
.week-head{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem;color:var(--muted)}
.week-head::after{content:"";flex:1;height:1px;background:var(--line)}
.pill{font-size:.72rem;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.week.current .week-head{color:var(--ink)}
.week.past{opacity:.6}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.week.current .task{border-color:var(--accent)}
.task input{width:20px;height:20px;margin-top:3px;accent-color:var(--done);flex:none;cursor:pointer}
.task p{margin:0;min-width:0;font-family:"IBM Plex Sans Hebrew","IBM Plex Sans Arabic",system-ui,sans-serif}
.task.is-done p{text-decoration:line-through;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);margin-top:14px}
footer{color:var(--muted);font-size:.82rem}
.note{margin:0;color:var(--muted);font-size:.85rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

עות בבניית מחוונים לכל סוגי ההערכה החלופית במידת הצורך"]}}, {"he": "פברואר", "ar": "شباط", "num": 2, "year": 2027, "weeks": {"3": ["ביצוע הערכה חילופית בכלל הכיתות במקצועות הליבה"], "4": ["הגשת סיכום (ציונים) הערכה חלופית לכלל הכיתות"]}}, {"he": "מרץ", "ar": "آذار", "num": 3, "year": 2027, "weeks": {"1": ["משימות הערכה מסכמות במקצועות מח\"ר (דת, גיאוגרפיה, היסטוריה)"], "2": ["מבחני סוף שליש ב - מקצועות ליבה"]}}, {"he": "אפר'", "ar": "نيسان", "num": 4, "year": 2027, "weeks": {}}, {"he": "מאי", "ar": "أيار", "num": 5, "year": 2027, "weeks": {"2": ["העברת אח\"מ פנימי (במידה ואין חיצוני)"], "3": ["מילוי שאלון שבע זירות על ידי כלל הצוות החינוכי", "הערכה מסכמת לכלל תוכניות גפן תשפ\"ז (באחריות רכז הערכה ו/או גפ\"ן)"]}}, {"he": "יוני", "ar": "حزيران", "num": 6, "year": 2027, "weeks": {"1": ["מבחני סוף שנה -  מיפויים כיתתיים בכל המקצועות לשכבות ז -ח בלבד"]}}];
const MONTHS_MAP = {"ינואר":[1,"كانون الثاني"],"פברואר":[2,"شباط"],"מרץ":[3,"آذار"],"אפריל":[4,"نيسان"],"מאי":[5,"أيار"],"יוני":[6,"حزيران"],"יולי":[7,"تموز"],"אוגוסט":[8,"آب"],"ספטמבר":[9,"أيلول"],"אוקטובר":[10,"تشرين الأول"],"נובמבר":[11,"تشرين الثاني"],"דצמבר":[12,"كانون الأول"]};
const WEEKS_MAP = {"ראשון":1,"שני":2,"שלישי":3,"רביעי":4,"חמישי":5};
const WEEK_NAMES = {1:"الأسبوع الأول",2:"الأسبوع الثاني",3:"الأسبوع الثالث",4:"الأسبوع الرابع",5:"الأسبوع الخامس"};

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=""; }
    else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(ch!=='\r') cell+=ch;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function matchMonth(name){
  const c=String(name||"").replace(/['"׳״\s]/g,"");
  if(c.length<3) return null;
  for(const k in MONTHS_MAP){ if(k===c||k.indexOf(c)===0) return MONTHS_MAP[k]; }
  return null;
}
function matchWeek(l){
  const t=String(l||"").trim();
  if(t.indexOf("שבוע")===-1) return 0;
  return WEEKS_MAP[t.replace("שבוע","").trim()]||0;
}
function monthsFromRows(v){
  const out=[]; if(v.length<2) return out;
  const h=v[0];
  for(let c=1;c<h.length;c++){
    const info=matchMonth(h[c]); if(!info) continue;
    const m={he:String(h[c]).trim(),ar:info[1],num:info[0],year:info[0]>=8?START_YEAR:START_YEAR+1,weeks:{}};
    let w=0;
    for(let r=1;r<v.length;r++){
      const x=matchWeek(v[r][0]); if(x) w=x;
      const t=String(v[r][c]||"").trim();
      if(w&&t){ (m.weeks[w]=m.weeks[w]||[]).push(t); }
    }
    out.push(m);
  }
  return out;
}
async function loadLive(){
  const lists = await Promise.all(SHEET_GIDS.map(async gid=>{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}&t=${Date.now()}`;
    const res=await fetch(url,{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    return monthsFromRows(parseCSV(await res.text()));
  }));
  const months=[].concat(...lists);
  if(!months.length) throw new Error("empty");
  return months;
}

const today=new Date();
const todayOrd=today.getFullYear()*12+(today.getMonth()+1);
const curWeek=Math.min(5,Math.ceil(today.getDate()/7));
const ord=m=>m.year*12+m.num;
const keyOf=m=>m.year+"-"+m.num;
let MONTHS=[];

let done={};
try{ done=JSON.parse(localStorage.getItem("bukhari-staff-done")||"{}"); }catch(e){ done={}; }
function save(){ try{ localStorage.setItem("bukhari-staff-done",JSON.stringify(done)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function count(m){ return Object.values(m.weeks).reduce((n,a)=>n+a.length,0); }

const monthsEl=document.getElementById("months");
const panel=document.getElementById("panel");
const note=document.getElementById("note");

function render(months, selected){
  MONTHS=months.slice().sort((a,b)=>ord(a)-ord(b));
  monthsEl.innerHTML="";
  MONTHS.forEach(m=>{
    const b=document.createElement("button");
    b.type="button"; b.id="tab-"+keyOf(m); b.setAttribute("role","tab");
    const n=count(m);
    b.innerHTML=`<span>${esc(m.ar)}</span><small>${n?n+" مهام":"لا مهام"}</small>${ord(m)===todayOrd?'<span class="now-dot" title="الشهر الحالي"></span>':''}`;
    b.addEventListener("click",()=>show(keyOf(m)));
    monthsEl.appendChild(b);
  });
  const cur=MONTHS.find(m=>ord(m)===todayOrd);
  show(selected && MONTHS.some(m=>keyOf(m)===selected) ? selected : (cur?keyOf(cur):(MONTHS[0]?keyOf(MONTHS[0]):"")));
}

let shown="";
function show(key){
  const m=MONTHS.find(x=>keyOf(x)===key)||MONTHS[0];
  if(!m){ panel.innerHTML='<div class="empty">لم يتم العثور على أشهر في الجدول.</div>'; return; }
  const k=keyOf(m); shown=k;
  monthsEl.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.id==="tab-"+k));
  const total=count(m);
  const weeks=Object.keys(m.weeks).map(Number).sort((a,b)=>a-b);
  const finished=weeks.reduce((n,w)=>n+m.weeks[w].filter(t=>done[k+"|"+t]).length,0);
  let html=`<div class="summary"><h2>${esc(m.ar)} <span lang="he">· ${esc(m.he)}</span></h2><span>${total?`أُنجز ${finished} من ${total}`:""}</span></div>`;
  if(!weeks.length){ html+='<div class="empty">لا توجد مهام مطلوبة في هذا الشهر.</div>'; }
  else{
    html+='<div class="weeks">';
    weeks.forEach(w=>{
      let cls="week";
      if(ord(m)===todayOrd){ if(w===curWeek) cls+=" current"; else if(w<curWeek) cls+=" past"; }
      else if(ord(m)<todayOrd) cls+=" past";
      html+=`<div class="${cls}"><div class="week-head">${WEEK_NAMES[w]}${cls.includes("current")?' <span class="pill">هذا الأسبوع</span>':''}</div>`;
      m.weeks[w].forEach((t,i)=>{
        const id=k+"|"+t;
        html+=`<label class="task${done[id]?" is-done":""}"><input type="checkbox" id="t-${k}-${w}-${i}" data-id="${esc(id)}"${done[id]?" checked":""}><p lang="he" dir="rtl">${esc(t)}</p></label>`;
      });
      html+='</div>';
    });
    html+='</div>';
  }
  panel.innerHTML=html;
  panel.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.addEventListener("change",()=>{
    if(cb.checked) done[cb.dataset.id]=true; else delete done[cb.dataset.id];
    save(); show(k);
  }));
}

render(FALLBACK);
note.textContent="جارٍ تحميل آخر تحديث من الجدول…";
loadLive().then(months=>{ render(months, shown); note.textContent=""; note.hidden=true; })
  .catch(()=>{ note.textContent="تعذّر تحميل آخر تحديث، تظهر الآن نسخة محفوظة سابقًا."; });
