<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לוח משימות – חטיבת הביניים אלבוכארי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<style>
/* Layout: one column; month buttons as a grid, tasks grouped by school week below */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#1b2340; --muted:#5d6480; --line:#dde0ea;
  --board:#1f3a8a; --board-ink:#f1f3fb; --accent:#c9962e; --accent-soft:#f8efdb; --done:#3f8a5c;
  --display:"Rubik","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --body:"IBM Plex Sans Hebrew","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141f; --surface:#1a1f30; --ink:#e6e9f3; --muted:#9aa1bb; --line:#2c3350;
  --board:#22397a; --board-ink:#f1f3fb; --accent:#e0b04f; --accent-soft:#332a17; --done:#6cc08d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141f; --surface:#1a1f30; --ink:#e6e9f3; --muted:#9aa1bb; --line:#2c3350;
  --board:#22397a; --board-ink:#f1f3fb; --accent:#e0b04f; --accent-soft:#332a17; --done:#6cc08d; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl;padding:0 16px}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:22px}
header{background:var(--board);color:var(--board-ink);border-radius:14px;padding:18px;display:flex;align-items:center;gap:18px;border-bottom:4px solid var(--accent)}
.logo{flex:none;background:#fff;border-radius:12px;padding:6px;width:120px}
.logo img{display:block;width:100%;height:auto}
.head-text{display:flex;flex-direction:column;gap:6px;min-width:0}
header h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;text-wrap:balance;line-height:1.35}
header p{margin:0;opacity:.85;font-size:.92rem}
.year{display:inline-block;font-size:.78rem;letter-spacing:.04em;background:rgba(255,255,255,.14);padding:2px 10px;border-radius:999px;align-self:flex-start}
@media (max-width:520px){header{flex-direction:column;text-align:center}.head-text{align-items:center}.year{align-self:center}}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.months button{font:inherit;font-family:var(--display);font-size:.98rem;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background .15s,border-color .15s}
.months button small{font-family:var(--body);font-size:.74rem;color:var(--muted)}
.months button:hover{border-color:var(--accent)}
.months button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#2a1e08}
.months button[aria-selected="true"] small{color:#4a3714}
.months button:focus-visible,.task input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.now-dot{width:6px;height:6px;border-radius:50%;background:var(--done)}
@media (max-width:620px){.months{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:420px){.months{grid-template-columns:repeat(3,minmax(0,1fr))}}
.summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.summary h2{font-family:var(--display);font-size:1.4rem;margin:0}
.summary span{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.weeks{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.week{display:flex;flex-direction:column;gap:8px}
.week-head{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.9rem;color:var(--muted)}
.week-head::after{content:"";flex:1;height:1px;background:var(--line)}
.pill{font-size:.72rem;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.week.current .week-head{color:var(--ink)}
.week.past{opacity:.6}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.week.current .task{border-color:var(--accent)}
.task input{width:20px;height:20px;margin-top:3px;accent-color:var(--done);flex:none;cursor:pointer}
.task p{margin:0;min-width:0;font-family:"IBM Plex Sans Hebrew","IBM Plex Sans Arabic",system-ui,sans-serif}
.task.is-done p{text-decoration:line-through;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);margin-top:14px}
footer{color:var(--muted);font-size:.82rem}
.note{margin:0;color:var(--muted);font-size:.85rem}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

": ["התכוננות לדיון העומק"], "4": ["עדכון פירוט מרכיבי הציון הכללי בכל מקצוע על ידי רכזי המקצועות במידת הצורך", "הגשת פירוט משימות ההערכה החלופית על ידי כלל המורים (נושא, סוג, מיומנויות מרכזיות, אחראי, ניקוד..)", "סיוע לרכזי המקצועות בבניית מחוונים לכל סוגי ההערכה החלופית במידת הצורך"]}}, {"he": "פברואר", "ar": "פברואר", "num": 2, "year": 2027, "weeks": {"3": ["ביצוע הערכה חילופית בכלל הכיתות במקצועות הליבה"], "4": ["הגשת סיכום (ציונים) הערכה חלופית לכלל הכיתות"]}}, {"he": "מרץ", "ar": "מרץ", "num": 3, "year": 2027, "weeks": {"1": ["משימות הערכה מסכמות במקצועות מח\"ר (דת, גיאוגרפיה, היסטוריה)"], "2": ["מבחני סוף שליש ב - מקצועות ליבה"]}}, {"he": "אפר'", "ar": "אפריל", "num": 4, "year": 2027, "weeks": {}}, {"he": "מאי", "ar": "מאי", "num": 5, "year": 2027, "weeks": {"2": ["העברת אח\"מ פנימי (במידה ואין חיצוני)"], "3": ["מילוי שאלון שבע זירות על ידי כלל הצוות החינוכי", "הערכה מסכמת לכלל תוכניות גפן תשפ\"ז (באחריות רכז הערכה ו/או גפ\"ן)"]}}, {"he": "יוני", "ar": "יוני", "num": 6, "year": 2027, "weeks": {"1": ["מבחני סוף שנה -  מיפויים כיתתיים בכל המקצועות לשכבות ז -ח בלבד"]}}]};
/* ---- قراءة لوح الجانت (مشترك بين المولّد والرزنامة) ---- */
var MONTH_DEFS = [
  [1,"ינואר",["ינואר","كانون الثاني","يناير"]],
  [2,"פברואר",["פברואר","شباط","فبراير"]],
  [3,"מרץ",["מרץ","מרס","آذار","مارس"]],
  [4,"אפריל",["אפריל","نيسان","أبريل","ابريل"]],
  [5,"מאי",["מאי","أيار","مايو"]],
  [6,"יוני",["יוני","حزيران","يونيو"]],
  [7,"יולי",["יולי","تموز","يوليو"]],
  [8,"אוגוסט",["אוגוסט","آب","أغسطس","اغسطس"]],
  [9,"ספטמבר",["ספטמבר","أيلول","سبتمبر"]],
  [10,"אוקטובר",["אוקטובר","تشرين الأول","أكتوبر","اكتوبر"]],
  [11,"נובמבר",["נובמבר","تشرين الثاني","نوفمبر"]],
  [12,"דצמבר",["דצמבר","كانون الأول","ديسمبر"]]
];
var WEEK_ORD = {"ראשון":1,"שני":2,"שלישי":3,"רביעי":4,"חמישי":5,
  "الاول":1,"اول":1,"الثاني":2,"ثاني":2,"الثالث":3,"ثالث":3,"الرابع":4,"رابع":4,"الخامس":5,"خامس":5};
var WEEK_NAMES = {0:"משימות החודש",1:"שבוע ראשון",2:"שבוע שני",3:"שבוע שלישי",4:"שבוע רביעי",5:"שבוע חמישי"};

function normText(s){
  return String(s == null ? "" : s)
    .replace(/[ً-ْ]/g,"").replace(/[أإآ]/g,"ا")
    .replace(/['"׳״.\-–]/g," ").replace(/\d+/g," ").replace(/\s+/g," ").trim();
}
function matchMonth(name){
  var n = normText(name).replace(/ /g,"");
  if (n.length < 3) return null;
  for (var i=0;i<MONTH_DEFS.length;i++){
    var d = MONTH_DEFS[i];
    for (var j=0;j<d[2].length;j++){
      var x = normText(d[2][j]).replace(/ /g,"");
      if (x === n) return {num:d[0], ar:d[1]};
      if (/[֐-׿]/.test(n) && x.indexOf(n) === 0) return {num:d[0], ar:d[1]};
    }
  }
  return null;
}
function matchWeek(label){
  var raw = String(label == null ? "" : label);
  var n = normText(raw);
  if (n.indexOf("שבוע") === -1 && n.indexOf("اسبوع") === -1) return 0;
  var dg = raw.match(/\d/);
  if (dg) return Math.min(5, Math.max(1, +dg[0]));
  var rest = n.replace("שבוע","").replace("الاسبوع","").replace("اسبوع","").trim().split(" ")[0];
  return WEEK_ORD[rest] || 0;
}
function parseCSV(text){
  var rows=[], row=[], cell="", q=false;
  for (var i=0;i<text.length;i++){
    var ch=text[i];
    if (q){ if (ch==='"'){ if (text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if (ch==='"') q=true;
    else if (ch===','){ row.push(cell); cell=""; }
    else if (ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if (ch!=='\r') cell+=ch;
  }
  if (cell!=="" || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
function monthsFromRows(v, startYear){
  var hr=-1, r, c;
  for (r=0;r<Math.min(v.length,20);r++){
    var n=0; for (c=0;c<(v[r]||[]).length;c++) if (matchMonth(v[r][c])) n++;
    if (n>=2){ hr=r; break; }
  }
  if (hr<0) return [];
  var wc=-1;
  outer: for (c=0;c<v[hr].length;c++){ for (r=hr+1;r<v.length;r++){ if (matchWeek((v[r]||[])[c])){ wc=c; break outer; } } }
  var out=[], h=v[hr];
  for (c=0;c<h.length;c++){
    if (c===wc) continue;
    var info=matchMonth(h[c]); if (!info) continue;
    var m={he:String(h[c]).trim(), ar:info.ar, num:info.num, year: info.num>=8 ? startYear : startYear+1, weeks:{}};
    var w=0;
    for (r=hr+1;r<v.length;r++){
      var row=v[r]||[];
      if (wc>=0){ var x=matchWeek(row[wc]); if (x) w=x; }
      var t=String(row[c]==null?"":row[c]).trim();
      if (t && (wc<0 || w)){ var k=wc<0?0:w; (m.weeks[k]=m.weeks[k]||[]).push(t); }
    }
    out.push(m);
  }
  return out;
}
function mergeMonths(list){
  var map={}, out=[];
  list.forEach(function(m){
    var k=m.year+"-"+m.num;
    if (!map[k]){ map[k]={he:m.he, ar:m.ar, num:m.num, year:m.year, weeks:{}}; out.push(map[k]); }
    Object.keys(m.weeks).forEach(function(w){ map[k].weeks[w]=(map[k].weeks[w]||[]).concat(m.weeks[w]); });
  });
  return out.sort(function(a,b){ return (a.year*12+a.num)-(b.year*12+b.num); });
}
function gvizUrl(src){
  return "https://docs.google.com/spreadsheets/d/"+src.id+"/gviz/tq?tqx=out:csv&headers=1&gid="+encodeURIComponent(src.gid)+"&t="+Date.now();
}

(function(){
  var today=new Date();
  var todayOrd=today.getFullYear()*12+(today.getMonth()+1);
  var curWeek=Math.min(5,Math.ceil(today.getDate()/7));
  function ord(m){ return m.year*12+m.num; }
  function keyOf(m){ return m.year+"-"+m.num; }
  var MONTHS=[], shown="", done={};
  try{ done=JSON.parse(localStorage.getItem(CONFIG.store)||"{}"); }catch(e){ done={}; }
  function save(){ try{ localStorage.setItem(CONFIG.store,JSON.stringify(done)); }catch(e){} }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function count(m){ return Object.keys(m.weeks).reduce(function(n,w){return n+m.weeks[w].length;},0); }
  var monthsEl=document.getElementById("months"), panel=document.getElementById("panel"), note=document.getElementById("note");

  function render(months, selected){
    MONTHS=mergeMonths(months);
    monthsEl.innerHTML="";
    MONTHS.forEach(function(m){
      var b=document.createElement("button");
      b.type="button"; b.id="tab-"+keyOf(m); b.setAttribute("role","tab");
      var n=count(m);
      b.innerHTML="<span>"+esc(m.ar)+"</span><small>"+(n>1?n+" משימות":(n===1?"משימה אחת":"אין משימות"))+"</small>"+(ord(m)===todayOrd?'<span class="now-dot" title="החודש הנוכחי"></span>':"");
      b.addEventListener("click",function(){ show(keyOf(m)); });
      monthsEl.appendChild(b);
    });
    var cur=MONTHS.filter(function(m){return ord(m)===todayOrd;})[0];
    var has=MONTHS.some(function(m){return keyOf(m)===selected;});
    show(has?selected:(cur?keyOf(cur):(MONTHS[0]?keyOf(MONTHS[0]):"")));
  }
  function show(key){
    var m=MONTHS.filter(function(x){return keyOf(x)===key;})[0]||MONTHS[0];
    if(!m){ panel.innerHTML='<div class="empty">אין עדיין חודשים בלוח.</div>'; return; }
    var k=keyOf(m); shown=k;
    Array.prototype.forEach.call(monthsEl.querySelectorAll("button"),function(b){ b.setAttribute("aria-selected", b.id==="tab-"+k); });
    var total=count(m);
    var weeks=Object.keys(m.weeks).map(Number).sort(function(a,b){return a-b;});
    var finished=weeks.reduce(function(n,w){ return n+m.weeks[w].filter(function(t){return done[k+"|"+t];}).length; },0);
    var sub='';
    var html='<div class="summary"><h2>'+esc(m.ar)+sub+'</h2><span>'+(total?'הושלמו '+finished+' מתוך '+total:'')+'</span></div>';
    if(!weeks.length){ html+='<div class="empty">אין משימות לחודש זה.</div>'; }
    else{
      html+='<div class="weeks">';
      weeks.forEach(function(w){
        var cls="week";
        if(w>0){
          if(ord(m)===todayOrd){ if(w===curWeek) cls+=" current"; else if(w<curWeek) cls+=" past"; }
          else if(ord(m)<todayOrd) cls+=" past";
        } else if(ord(m)<todayOrd) cls+=" past";
        html+='<div class="'+cls+'"><div class="week-head">'+WEEK_NAMES[w]+(cls.indexOf("current")>-1?' <span class="pill">השבוע</span>':'')+'</div>';
        m.weeks[w].forEach(function(t,i){
          var id=k+"|"+t;
          html+='<label class="task'+(done[id]?' is-done':'')+'"><input type="checkbox" id="t-'+k+'-'+w+'-'+i+'" data-id="'+esc(id)+'"'+(done[id]?' checked':'')+'><p dir="auto">'+esc(t)+'</p></label>';
        });
        html+='</div>';
      });
      html+='</div>';
    }
    panel.innerHTML=html;
    Array.prototype.forEach.call(panel.querySelectorAll("input[type=checkbox]"),function(cb){
      cb.addEventListener("change",function(){ if(cb.checked) done[cb.dataset.id]=true; else delete done[cb.dataset.id]; save(); show(k); });
    });
  }

  render(CONFIG.data||[]);
  if(CONFIG.sources && CONFIG.sources.length){
    Promise.all(CONFIG.sources.map(function(src){
      return fetch(gvizUrl(src),{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
        .then(function(txt){ return monthsFromRows(parseCSV(txt), CONFIG.startYear); });
    })).then(function(lists){
      var all=[].concat.apply([],lists);
      if(!all.length) throw new Error("empty");
      render(all, shown); note.hidden=true;
    }).catch(function(){
      note.textContent="לא ניתן לטעון את העדכון האחרון מהגיליון. מוצג עותק שמור."; note.hidden=false;
    });
  }
})();
